<nav aria-label="Reference Guides">
  <mat-expansion-panel
    class="nav-expansion"
    routerLinkActive
    #referenceGuideRla="routerLinkActive"
    [expanded]="forceExpanded() || referenceGuideRla.isActive">
    <mat-expansion-panel-header>
      <span class="menu-content parent-expansion-item">Reference Guides</span>
    </mat-expansion-panel-header>

    <sdux-references-subnavigation />

    <div class="sub-menu">
      <a
        mat-list-item
        routerLink="/docs/diagrams"
        routerLinkActive="active"
        (click)="closeSidenav()">
        <span class="menu-content sub-item">Diagrams</span>
      </a>

      <a
        mat-list-item
        routerLink="/welcome/testing"
        routerLinkActive="active"
        (click)="closeSidenav()">
        <span class="menu-content sub-item">Testing {{ brandName }}</span>
      </a>

      <a
        mat-list-item
        routerLink="/docs/videos"
        routerLinkActive="active"
        (click)="closeSidenav()">
        <span class="menu-content sub-item">Videos</span>
      </a>
    </div>
  </mat-expansion-panel>
</nav>
