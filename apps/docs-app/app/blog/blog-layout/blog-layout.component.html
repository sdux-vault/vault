<div class="docs-container">
  <div class="blog-back-link">
    <a routerLink="/blog">← All Posts</a>
  </div>

  <div class="header">
    <h3>{{ title() }}</h3>
  </div>

  <div class="blog-meta">
    <span class="blog-date">{{ date() }}</span>
    <span
      class="blog-pillar"
      [attr.aria-label]="pillarLabel()"
      [matTooltip]="pillarLabel()"
      >{{ pillar() }}</span
    >
    <span class="blog-reading-time">{{ readingTime() }} min read</span>
  </div>

  <ng-content />

  <sdux-pipeline-related-topics [isDocs]="false" />
</div>
