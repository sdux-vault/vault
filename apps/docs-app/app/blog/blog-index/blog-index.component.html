<div class="docs-container">
  <div class="header">
    <h2>Blog</h2>
  </div>

  <header class="docs-header">
    <p class="lead">
      Technical articles, tutorials, and insights from the SDuX Vault team.
    </p>
  </header>

  <section class="section">
    <div class="section-title">Latest Posts</div>
    <div class="section-body">
      @for (entry of entries; track entry.slug) {
        <div class="blog-post-entry">
          <a
            [routerLink]="'/blog/' + entry.slug"
            [attr.aria-label]="'Read blog post: ' + entry.title"
            >{{ entry.title }}</a
          >
          <span class="blog-entry-meta">
            <span
              class="blog-entry-date"
              [attr.aria-label]="'Published ' + entry.date"
              >{{ entry.date }}</span
            >
            <span class="blog-entry-reading-time"
              >{{ entry.readingTime }} min read</span
            >
          </span>
        </div>
      }
    </div>
  </section>
</div>
