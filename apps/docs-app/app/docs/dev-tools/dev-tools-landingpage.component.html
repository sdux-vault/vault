@switch (type) {
  @case ('built-in-debugger') {
    <sdux-dev-tools-built-in-debugger />
  }

  @case ('chrome-devtools-extension') {
    <sdux-dev-tools-chrome-extension />
  }

  @case ('event-bus') {
    <sdux-dev-tools-event-bus />
  }

  @case ('vault-monitor') {
    <sdux-dev-tools-vault-monitor />
  }

  @default {
    <sdux-dev-tools-overview />
  }
}
