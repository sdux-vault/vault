<footer class="footer" [class.isMobile]="isMobile()" aria-label="Site footer">
  <div class="info-container">
    <a routerLink="sdux/training" routerLinkActive="active">
      Corporate Trainings & Boot Camps
    </a>
    &nbsp; | &nbsp;
    <a routerLink="contact" routerLinkActive="active"> Contact Us </a>
    &nbsp; | &nbsp;
    <a routerLink="sitemap" routerLinkActive="active"> Sitemap </a>
  </div>
  @if (!isMobile()) {
    <span class="sdux-container-spacer"></span>
  }
  <div class="social-container">
    <a
      href="https://x.com/sduxvault"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Follow SDuX Vault on X"
      matTooltip="Follow us on X">
      <img src="assets/social-media/x.svg" alt="X" />
    </a>
    <a
      href="https://bsky.app/profile/sdux-vault.com"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Follow SDuX Vault on Bluesky"
      matTooltip="Follow us on Bluesky">
      <img src="assets/social-media/bluesky.svg" alt="Bluesky" />
    </a>
    <a
      href="https://mastodon.social/@sduxvault"
      target="_blank"
      rel="me noopener noreferrer"
      aria-label="Follow SDuX Vault on Mastodon"
      matTooltip="Follow us on Mastodon">
      <img src="assets/social-media/mastodon.svg" alt="Mastodon" />
    </a>
    <a
      href="https://github.com/sdux-vault"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="SDuX Vault on GitHub"
      matTooltip="GitHub">
      <img src="assets/social-media/github.svg" alt="GitHub" />
    </a>
    <a
      href="https://discord.gg/9WpQKjs9BC"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Join SDuX Vault Discord"
      matTooltip="Join our Discord">
      <img src="assets/social-media/discord.svg" alt="Discord" />
    </a>
    <a
      href="https://www.youtube.com/channel/UCEzpIIo-6HXU2IWS1y1fZIA"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="SDuX Vault on YouTube"
      matTooltip="YouTube">
      <img src="assets/social-media/youtube.svg" alt="YouTube" />
    </a>
    <a
      href="https://www.npmjs.com/package/@sdux-vault/core"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="SDuX Vault on npm"
      matTooltip="npm">
      <img src="assets/social-media/npm.svg" alt="npm" />
    </a>
  </div>
  <div class="license-container">
    <span>Powered by <sdux-brand-name /> LLC ©2026.</span>
    <a
      mat-list-item
      routerLink="/docs/welcome/license"
      routerLinkActive="active">
      Code licensed under an MIT-style License.
    </a>
    <span>Documentation licensed under CC BY 4.0.</span>
  </div>
</footer>
