<div class="demo-app">
  <div class="demo-toolbar">
    <div class="demo-title">SDuX Vault – DevTools Demo Harness</div>

    <div class="demo-state-panels">
      <div class="state-container">
        <div class="label">Input State</div>
        <div class="hint">Raw data before processing</div>
        <textarea class="data-textarea" readonly>{{ sample | json }}</textarea>
      </div>

      <div class="state-container">
        <div class="label">FeatureCell State</div>
        <div class="hint">Final state after filters and reducers run</div>
        @if (state.isLoading()) {
          <div class="status">Loading...</div>
        } @else if (state.error()) {
          <textarea class="data-textarea error" readonly>{{
            state.error() | json
          }}</textarea>
        } @else if (state.hasValue()) {
          <textarea class="data-textarea" readonly>{{
            state.value() | json
          }}</textarea>
        } @else {
          <textarea class="data-textarea" readonly>No state</textarea>
        }
      </div>
    </div>

    <div class="demo-actions">
      <button type="button" class="demo-btn primary" (click)="loadSample()">
        Load Sample State
      </button>
      <button type="button" class="demo-btn" (click)="resetState()">
        Reset State
      </button>
      <button type="button" class="demo-btn" (click)="toggleLoading()">
        Loading ({{ isLoading() }})
      </button>
      <button type="button" class="demo-btn" (click)="toggleError()">
        Error ({{ hasError() }})
      </button>
    </div>
  </div>
  <div class="demo-devtools-frame">
    <sdux-devtools-splash-page></sdux-devtools-splash-page>
  </div>
</div>
