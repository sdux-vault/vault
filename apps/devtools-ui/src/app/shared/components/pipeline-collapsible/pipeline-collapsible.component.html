<div
  class="pipeline-collapsible-wrapper"
  [class.pipeline-collapsible-expanded]="expanded()">
  <div
    class="pipeline-collapsible-header"
    (click)="toggle()"
    (keydown.enter)="toggle()"
    (keydown.space)="toggle(); $event.preventDefault()"
    tabindex="0"
    role="button"
    [attr.aria-expanded]="expanded()">
    <span class="pipeline-label-group">
      <span class="pipeline-label">{{ label() }}</span>
      @if (detail()) {
        <span class="pipeline-count">{{ detail() }}</span>
      }
      @if (infoTooltip()) {
        <img
          class="pipeline-info-icon"
          src="assets/icons/help-icon.png"
          alt=""
          [matTooltip]="infoTooltip()" />
      }
    </span>
    <mat-icon
      class="pipeline-chevron"
      [class.pipeline-chevron-expanded]="expanded()"
      [matTooltip]="tooltip()"
      aria-hidden="true"
      >chevron_right</mat-icon
    >
  </div>
  @if (expanded()) {
    <div class="pipeline-collapsible-content">
      <ng-content />
    </div>
  }
</div>
