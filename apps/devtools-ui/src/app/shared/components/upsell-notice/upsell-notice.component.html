<div class="upsell-notice" role="status" aria-live="polite">
  <img
    src="assets/brand/sdux-vault-landscape-dark.png"
    alt="SDuX Vault logo"
    class="upsell-logo" />
  <p>
    {{ headline() }}
    <strong>Pro</strong> or <strong>Enterprise</strong> license.
  </p>
  <p class="upsell-body">{{ body() }}</p>
  <p class="upsell-cta">
    <a
      href="https://www.sdux-vault.com/dashboard"
      target="_blank"
      rel="noopener noreferrer"
      class="sdux-button cta-button"
      aria-label="Purchase Pro License — opens in a new tab"
      >Purchase Pro License</a
    >
  </p>
</div>
