<div class="detail-panel" sduxEscapeClose (escapeClose)="closeDetail.emit()">
  <div class="detail-header">
    <h3>{{ title() }}</h3>
    <button
      type="button"
      class="close-btn back-btn"
      aria-label="Back to list"
      matTooltip="Back to list"
      (click)="closeDetail.emit()">
      &#8592;
    </button>
    <button
      type="button"
      class="close-btn dismiss-btn"
      aria-label="Close detail panel"
      matTooltip="Close detail panel"
      (click)="closeDetail.emit()">
      &#10005;
    </button>
  </div>

  <div class="detail-body">
    <ng-content></ng-content>
  </div>
</div>
