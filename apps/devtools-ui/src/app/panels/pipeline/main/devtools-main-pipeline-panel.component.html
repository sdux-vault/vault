<div class="pipeline-panel">
  <section class="event-stream">
    @if (reversedEvents()) {
      <cdk-virtual-scroll-viewport
        itemSize="52"
        class="event-list"
        role="log"
        aria-label="Pipeline events">
        <div
          *cdkVirtualFor="
            let event of reversedEvents();
            let i = index;
            trackBy: trackById
          "
          class="event-row">
          <sdux-devtools-pipeline-event
            [event]="event"
            [totalEvents]="totalEvents() - i"
            [selected]="selectedEvent()?.id === event.id"
            (selectEvent)="selectEvent($event)"></sdux-devtools-pipeline-event>
        </div>
      </cdk-virtual-scroll-viewport>
    }
  </section>

  @if (selectedEvent(); as selected) {
    <aside class="detail-pane">
      <sdux-devtools-pipeline-event-detail
        [event]="selected"
        (closeDetail)="closeDetail()"></sdux-devtools-pipeline-event-detail>
    </aside>
  }
</div>
