<div class="sdux-tab-container">
  <mat-tab-group
    animationDuration="200ms"
    mat-stretch-tabs="false"
    class="sdux-tabs">
    @for (tab of visibleTabs(); track tab.label) {
      <mat-tab [label]="tab.label">
        <div class="tab-panel">
          <sdux-example-viewer-source
            [displayTabs]="false"
            [displayCopyPaste]="displayCopyPaste()"
            [showFrameworkSelector]="true"
            [availableFrameworks]="tabLabels()">
            <sdux-example-viewer-tab
              [label]="tab.label + ' — ' + description()">
              <ng-container *ngTemplateOutlet="getTemplate(tab)" />
            </sdux-example-viewer-tab>
          </sdux-example-viewer-source>
        </div>
      </mat-tab>
    }
  </mat-tab-group>
</div>
