<VirtualHost *:80>
    ServerName localhost

    ProxyPreserveHost On

    # WebSocket support for Angular live-reload (HMR)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://sdux_node:4200/$1" [P,L]

    ProxyPass / http://sdux_node:4200/
    ProxyPassReverse / http://sdux_node:4200/

    ErrorLog /usr/local/apache2/logs/httpd/error.log
    CustomLog /usr/local/apache2/logs/httpd/access.log combined
</VirtualHost>