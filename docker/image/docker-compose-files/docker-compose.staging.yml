version: '3.8'

services:
  sdux_staging:
    container_name: ${CONTAINER_NAME}-staging
    image: ${CONTAINER_NAME}:${VERSION_TAG}
    restart: always

    # Expose port 4100 to host
    ports:
      - '4100:80'

    # Use bridge networking
    networks:
      - sdux_staging_net

networks:
  sdux_staging_net:
    driver: bridge
