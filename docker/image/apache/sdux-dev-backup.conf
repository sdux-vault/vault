<VirtualHost *:80>
    ServerName backup.sdux-vault.dev

    RewriteEngine On
    RewriteRule ^/?$ https://backup.sdux-vault.dev/developer [R=302,L]
    RewriteRule ^/(.*)$ https://backup.sdux-vault.dev/$1 [R=permanent,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName backup.sdux-vault.dev
    DocumentRoot "/opt/bitnami/apache/htdocs"

    SSLEngine on
    SSLCertificateFile "/opt/bitnami/apache/conf/sdux-vault.com.crt"
    SSLCertificateKeyFile "/opt/bitnami/apache/conf/sdux-vault.com.key"

        # BEGIN: Redirect docs.backup.* subdomain to /docs
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^docs\. [NC]
    RewriteRule ^(.*)$ https://backup.sdux-vault.dev/docs$1 [R=permanent,L]
    # END: Redirect docs.backup.* subdomain to /docs

    # BEGIN: Route the site homepage to the developer-focused entry page
    RewriteRule ^/?$ https://backup.sdux-vault.dev/developer [R=302,L]
    # END: Route the site homepage to the developer-focused entry page

    <Directory "/opt/bitnami/apache/htdocs">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ProxyPreserveHost On
    RequestHeader set Host "sdux-vault.dev"

    ProxyPass / http://127.0.0.1:5101/
    ProxyPassReverse / http://127.0.0.1:5101/

    ErrorLog  "/opt/bitnami/apache/logs/sdux-vault-dev-backup-error.log"
    CustomLog "/opt/bitnami/apache/logs/sdux-vault-dev-backup-access.log" combined
</VirtualHost>