<VirtualHost 127.0.0.1:80 _default_:80>
  ServerName www.sdux-vault.com
  ServerAlias sdux-vault.com sduxvault.com www.sduxvault.com

  # BEGIN: Configuration for letsencrypt
  Include "/opt/bitnami/apps/letsencrypt/conf/httpd-prefix.conf"
  # END: Configuration for letsencrypt

  # BEGIN: Support domain renewal when using mod_proxy without Location
  <IfModule mod_proxy.c>
    ProxyPass /.well-known !
  </IfModule>
  # END: Support domain renewal when using mod_proxy without Location

  # BEGIN: HTTP to HTTPS redirection
  RewriteEngine On
  RewriteCond %{HTTPS} !=on
  RewriteCond %{REQUEST_URI} !^/\.well-known
  RewriteRule ^/(.*) https://%{SERVER_NAME}/$1 [R,L]
  # END: HTTP to HTTPS redirection

  ErrorLog  "/opt/bitnami/apache/logs/sdux-vault-error.log"
  CustomLog "/opt/bitnami/apache/logs/sdux-vault-access.log" combined
</VirtualHost>

<VirtualHost 127.0.0.1:443 _default_:443>
  ServerName www.sdux-vault.com
  ServerAlias sdux-vault.com sduxvault.com www.sduxvault.com

  SSLEngine on
  SSLCertificateFile "/opt/bitnami/apache/conf/sdux-vault.com.crt"
  SSLCertificateKeyFile "/opt/bitnami/apache/conf/sdux-vault.com.key"

  # BEGIN: Configuration for letsencrypt
  Include "/opt/bitnami/apps/letsencrypt/conf/httpd-prefix.conf"
  # END: Configuration for letsencrypt

  # BEGIN: Support domain renewal when using mod_proxy without Location
  <IfModule mod_proxy.c>
    ProxyPass /.well-known !
  </IfModule>
  # END: Support domain renewal when using mod_proxy without Location

  # BEGIN: Enable non-www to www redirection
  RewriteEngine On
  RewriteCond %{HTTP_HOST} !^www\. [NC]
  RewriteCond %{HTTP_HOST} !^localhost
  RewriteCond %{HTTP_HOST} !^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+(:[0-9]+)?$
  RewriteCond %{REQUEST_URI} !^/\.well-known
  RewriteRule ^(.*)$ https://www.%{HTTP_HOST}%{REQUEST_URI} [R=permanent,L]
  # END: Enable non-www to www redirection

  ProxyPass / http://localhost:3100/
  ProxyPassReverse / http://localhost:3100/

  # BEGIN: Support domain renewal when using mod_proxy within Location
  <Location /.well-known>
    <IfModule mod_proxy.c>
      ProxyPass !
    </IfModule>
  </Location>
  # END: Support domain renewal when using mod_proxy within Location

  ErrorLog  "/opt/bitnami/apache/logs/sdux-vault-error.log"
  CustomLog "/opt/bitnami/apache/logs/sdux-vault-access.log" combined
</VirtualHost>