<VirtualHost *:80>
    ServerName staging.sdux-vault.com
    ServerAlias staging.sduxvault.com docs.staging.sdux-vault.com docs.staging.sduxvault.com
    Redirect permanent / https://staging.sdux-vault.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName staging.sdux-vault.com
    ServerAlias staging.sduxvault.com docs.staging.sdux-vault.com docs.staging.sduxvault.com
    DocumentRoot "/opt/bitnami/apache/htdocs"

    SSLEngine on
    SSLCertificateFile "/opt/bitnami/apache/conf/sdux-vault.com.crt"
    SSLCertificateKeyFile "/opt/bitnami/apache/conf/sdux-vault.com.key"

    # BEGIN: Redirect docs.staging.* subdomain to /docs
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^docs\. [NC]
    RewriteRule ^(.*)$ https://staging.sdux-vault.com/docs$1 [R=permanent,L]
    # END: Redirect docs.staging.* subdomain to /docs

    <Directory "/opt/bitnami/apache/htdocs">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ProxyPreserveHost On
    RequestHeader set Host "sdux-vault.com"

    ProxyPass / http://127.0.0.1:4100/
    ProxyPassReverse / http://127.0.0.1:4100/

    ErrorLog  "/opt/bitnami/apache/logs/sdux-vault-staging-error.log"
    CustomLog "/opt/bitnami/apache/logs/sdux-vault-staging-access.log" combined
</VirtualHost>