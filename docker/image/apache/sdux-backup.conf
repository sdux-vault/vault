<VirtualHost *:80>
    ServerName backup.sdux-vault.com
    ServerAlias backup.sduxvault.com
    Redirect permanent / https://backup.sdux-vault.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName backup.sdux-vault.com
    ServerAlias backup.sduxvault.com
    DocumentRoot "/opt/bitnami/apache/htdocs"

    SSLEngine on
    SSLCertificateFile "/opt/bitnami/apache/conf/sdux-vault.com.crt"
    SSLCertificateKeyFile "/opt/bitnami/apache/conf/sdux-vault.com.key"

    <Directory "/opt/bitnami/apache/htdocs">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ProxyPreserveHost On
    RequestHeader set Host "sdux-vault.com"

    ProxyPass / http://127.0.0.1:5100/
    ProxyPassReverse / http://127.0.0.1:5100/

    ErrorLog  "/opt/bitnami/apache/logs/sdux-vault-backup-error.log"
    CustomLog "/opt/bitnami/apache/logs/sdux-vault-backup-access.log" combined
</VirtualHost>